<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090706"><title>معلم الشاورما — تجهيز الطلبات</title><style>
:root{--bg:#090807;--panel:#14110e;--panel2:#1b1510;--cream:#fff7e9;--muted:#a79d91;--gold:#f4b52e;--ember:#ed6a20;--red:#d62918;--green:#35d98b;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 100% 0,#d629181c,transparent 30%),#090807}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100dvh;padding:16px;display:grid;grid-template-rows:auto auto 1fr;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--ember));color:#171008;font-weight:1000}.brand h1{margin:0;font-size:21px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--cream);border-radius:12px;padding:10px 13px}.primary{background:linear-gradient(135deg,var(--gold),var(--ember));color:#171008;border:0;font-weight:950}.toolbar{display:flex;gap:8px}.search{flex:1;height:44px;background:#0006;border:1px solid var(--line);border-radius:12px;color:#fff;padding:0 13px;outline:0}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap}.tab.active{color:var(--gold);border-color:#f4b52e55}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:auto;align-content:start}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1a1510,#0e0c09);padding:15px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 60px #0006}.card.new{border-color:#d6291860;box-shadow:0 0 0 1px #d6291820,0 20px 70px #0008}.card.ready{border-color:#35d98b50;background:linear-gradient(145deg,#122119,#0d110e)}.head{display:flex;justify-content:space-between;gap:8px}.num{font-size:28px;font-weight:1000}.time{font-size:10px;color:var(--muted)}.badge{padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;background:#d6291818;color:#ff8b7d;border:1px solid #d6291840}.badge.prep{color:var(--gold);background:#f4b52e12;border-color:#f4b52e40}.badge.ready{color:#7ce9b2;background:#35d98b12;border-color:#35d98b40}.items{display:flex;flex-direction:column;gap:7px}.item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:11px;background:#ffffff05;border:1px solid #ffffff07}.item strong{font-size:12px}.item span{color:var(--gold);font-weight:950}.note{padding:9px 10px;border-radius:11px;background:#ed6a2012;color:#ffc58e;font-size:10px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;font-weight:950}.total b{color:var(--gold)}.actions2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}.login{position:fixed;inset:0;background:#050403e8;backdrop-filter:blur(18px);display:grid;place-items:center;padding:18px;z-index:5}.loginbox{width:min(410px,100%);background:linear-gradient(145deg,#1a1510,#0d0b09);border:1px solid var(--line);border-radius:24px;padding:22px}.field{margin-top:12px}.field label{display:block;color:#c9c0b6;font-size:10px;margin-bottom:6px}.field input{width:100%;height:45px;background:#080706;border:1px solid var(--line);border-radius:11px;color:#fff;padding:0 12px}.error{color:#ff9a8c;font-size:10px;margin-top:9px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.app{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.actions .btn:not(.primary){padding:9px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><div class="brand"><div class="logo">م</div><div><h2 style="margin:0">تجهيز الطلبات</h2><p>لوحة موظف المطبخ · معلم الشاورما</p></div></div><div class="field"><label>رقم الهاتف</label><input id="phone" dir="ltr" placeholder="07xxxxxxxxx"></div><div class="field hidden" id="otpWrap"><label>رمز التحقق</label><input id="otp" dir="ltr" inputmode="numeric" maxlength="6"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="send">إرسال رمز الدخول</button><button class="btn hidden" id="verify">دخول</button></div><div class="error" id="error"></div></div></div>
<div class="app hidden" id="app"><header class="top"><div class="brand"><div class="logo">م</div><div><h1>تجهيز الطلبات</h1><p>كل طلب جديد يظهر هنا فوراً · الدينار العراقي</p></div></div><div class="actions"><button class="btn" id="sound">🔔 صوت</button><button class="btn" id="full">⛶</button><button class="btn" id="logout">خروج</button></div></header><div><div class="toolbar"><input id="search" class="search" placeholder="ابحث برقم الطلب..."><button class="btn" data-filter="all">الكل</button><button class="btn" data-filter="new">جديد</button><button class="btn" data-filter="preparing">قيد التحضير</button><button class="btn" data-filter="ready">جاهز</button></div><div class="tabs" style="margin-top:8px"><button class="btn tab active" data-filter="all">كل الطلبات</button><button class="btn tab" data-filter="new">طلبات جديدة</button><button class="btn tab" data-filter="preparing">قيد التحضير</button><button class="btn tab" data-filter="ready">جاهزة</button></div></div><main class="grid" id="grid"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const KEY='maallim-display-config-v1';const $=id=>document.getElementById(id);const cfg=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};const fmt=n=>new Intl.NumberFormat('ar-IQ').format(Number(n||0))+' د.ع';const norm=s=>String(s||'').toLowerCase();let sb=null,session=null,orders=[],filter='all',sound=true,ctx;
function error(t){$('error').textContent=t||''}function render(){const q=norm($('search').value);let rows=orders.filter(o=>{const st=norm(o.status);const f=filter==='all'||(filter==='new'&&['pending','new'].includes(st))||(filter==='preparing'&&['confirmed','preparing','in_progress','accepted'].includes(st))||(filter==='ready'&&['ready','ready_for_pickup'].includes(st));return f&&(!q||String(o.order_number||o.id).includes(q))});if(!rows.length){$('grid').innerHTML='<div class="empty">لا توجد طلبات في هذا القسم</div>';return}$('grid').innerHTML=rows.map(o=>card(o)).join('');document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>next(b.dataset.next,b.dataset.status));}
function card(o){const st=norm(o.status);const items=Array.isArray(o.order_items)?o.order_items:[];let label='جديد',cls='';if(['confirmed','preparing','in_progress','accepted'].includes(st)){label='قيد التحضير';cls='prep'}if(['ready','ready_for_pickup'].includes(st)){label='جاهز';cls='ready'}const next=st==='pending'||st==='new'?'preparing':(['confirmed','preparing','in_progress','accepted'].includes(st)?'ready':'completed');const button=next==='preparing'?'بدء التحضير':next==='ready'?'تم التجهيز — جاهز':'إتمام الطلب';return `<article class="card ${st==='pending'||st==='new'?'new':''} ${cls}"><div class="head"><div><div class="num">#${o.order_number||String(o.id).slice(0,6)}</div><div class="time">${new Date(o.created_at).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="badge ${cls}">${label}</div></div><div class="items">${items.length?items.map(i=>`<div class="item"><strong>${i.product_name||i.name||'صنف'}</strong><span>×${i.quantity||1}</span></div>`).join(''):'<div class="item"><strong>تفاصيل الطلب</strong><span>—</span></div>'}</div>${o.notes?`<div class="note">ملاحظة: ${o.notes}</div>`:''}<div class="total"><span>الإجمالي</span><b>${fmt(o.total)}</b></div><div class="actions2"><button class="btn primary" data-next="${o.id}" data-status="${next}">${button}</button><button class="btn" onclick="alert('رقم الطلب: #${o.order_number||o.id}')">تفاصيل</button></div></article>`}
async function load(){if(!sb)return;const{data,error:e}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);if(!e){orders=data||[];render()}}
async function next(id,status){const{error:e}=await sb.from('orders').update({status}).eq('id',id);if(e){alert('تعذر تحديث حالة الطلب');return}await load()}
async function init(){const c=cfg();if(!c.url||!c.key){error('إعداد Supabase غير موجود في الجهاز.');return}sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const r=await sb.auth.getSession();session=r.data.session;if(!session)return;const s=await sb.from('restaurant_staff').select('role,active').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(s.error||!s.data||!['kitchen','staff','manager','admin'].includes(norm(s.data.role))){error('هذا الحساب ليس موظف تجهيز مخوّلاً.');await sb.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();sb.channel('staff-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},async p=>{if(p.eventType==='INSERT')beep();await load()}).subscribe()}
$('send').onclick=async()=>{const c=cfg();if(!c.url||!c.key){error('أضف إعدادات Supabase إلى الجهاز أولاً.');return}sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const{error:e}=await sb.auth.signInWithOtp({phone:$('phone').value.trim()});if(e)error(e.message);else{$('otpWrap').classList.remove('hidden');$('verify').classList.remove('hidden');$('send').classList.add('hidden');error('تم إرسال الرمز.')}};
$('verify').onclick=async()=>{const{error:e}=await sb.auth.verifyOtp({phone:$('phone').value.trim(),token:$('otp').value.trim(),type:'sms'});if(e)error(e.message);else init()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('search').oninput=render;$('logout').onclick=async()=>{await sb?.auth.signOut();location.reload()};$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔔 صوت':'🔕 صامت'};function beep(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.value=.06;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2)}catch{}}init();
</script></body></html>
