<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080706"><title>معلم الشاورما — لوحة الاستلام</title>
<style>
:root{--bg:#080706;--panel:#14100d;--panel2:#1b1510;--cream:#fff7ea;--muted:#a89e92;--gold:#f4b52e;--ember:#ed6a20;--red:#d62918;--green:#39d98a;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}body{background:radial-gradient(circle at 100% 0,rgba(214,41,24,.14),transparent 30%),linear-gradient(145deg,#070605,#15110d 58%,#080706)}button,input{font:inherit}button{cursor:pointer}.page{min-height:100dvh;padding:16px;display:grid;grid-template-rows:auto auto 1fr;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--ember));color:#181008;font-size:21px;font-weight:1000}.brand h1{margin:0;font-size:20px}.sub{margin-top:3px;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--cream);border-radius:12px;padding:10px 12px}.live{display:flex;gap:7px;align-items:center;color:#b1f1ce;font-size:10px}.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.toolbar{display:flex;gap:8px}.search{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:#0b0907;color:var(--cream);padding:0 13px;outline:none}.search:focus{border-color:#f4b52e66}.board{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;min-height:0}.panel{min-height:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(145deg,rgba(22,17,13,.96),rgba(9,8,7,.93));display:grid;grid-template-rows:auto 1fr}.head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:16px}.badge{padding:6px 10px;border-radius:999px;background:#0005;border:1px solid var(--line);font-size:10px}.grid{padding:12px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-content:start}.order{min-height:125px;border-radius:20px;border:1px solid #f4b52e38;background:linear-gradient(145deg,rgba(244,181,46,.12),rgba(255,255,255,.018));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform .15s,border-color .15s;animation:in .3s ease}.order:hover{transform:translateY(-2px);border-color:#f4b52e88}.order-number{font-size:clamp(29px,4vw,52px);font-weight:1000;line-height:1}.make-ready{width:84%;height:38px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--ember));color:#171008;font-size:11px;font-weight:1000}.recent .grid{grid-template-columns:repeat(2,1fr)}.ready-card{min-height:95px;border-radius:18px;border:1px solid #39d98a35;background:linear-gradient(145deg,rgba(57,217,138,.10),rgba(255,255,255,.018));display:grid;place-items:center}.ready-card strong{font-size:30px;color:#9aeec5}.empty{grid-column:1/-1;min-height:220px;display:grid;place-items:center;text-align:center;color:#756d64;border:1px dashed var(--line);border-radius:18px}.empty strong{display:block;color:#aaa097;margin-bottom:6px}.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(4,3,2,.85);backdrop-filter:blur(18px)}.card{width:min(430px,100%);padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1a1511,#0c0a08);box-shadow:0 35px 120px #000b}.card h2{margin:0;font-size:22px}.card p{color:var(--muted);font-size:11px;line-height:1.7}.field{margin-top:13px}.field label{display:block;font-size:10px;color:#c8beb2;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid var(--line);border-radius:11px;background:#090807;color:#fff;padding:0 12px;outline:none}.row{display:flex;gap:8px;margin-top:13px}.row>*{flex:1}.primary{border:0;background:linear-gradient(135deg,var(--gold),var(--ember));color:#171008;font-weight:1000}.hidden{display:none!important}.error{color:#ff9d8d;font-size:10px;margin-top:9px}.setup{margin-top:12px;padding:10px;border-radius:12px;background:rgba(244,181,46,.06);border:1px solid rgba(244,181,46,.12);color:#bfb5a9;font-size:9px;line-height:1.6}@keyframes in{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}@media(max-width:900px){.board{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.recent .grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.page{padding:10px}.brand h1{font-size:17px}.sub{font-size:9px}.actions .live{display:none}.grid,.recent .grid{grid-template-columns:repeat(2,1fr)}.order{min-height:120px}}
</style></head><body>
<div id="login" class="login"><form class="card" id="loginForm"><div class="brand"><div class="logo">م</div><div><h2>لوحة الاستلام</h2><p>للموظف الذي ينقل الطلب الجاهز إلى الزبون</p></div></div><div class="field"><label>رقم هاتف الموظف</label><input id="phone" dir="ltr" inputmode="tel" placeholder="07xxxxxxxxx" required></div><div class="field hidden" id="otpWrap"><label>رمز التحقق</label><input id="otp" dir="ltr" inputmode="numeric" maxlength="6" placeholder="123456"></div><div class="row"><button type="button" id="send" class="btn primary">إرسال رمز الدخول</button><button type="button" id="verify" class="btn hidden">دخول</button></div><div id="error" class="error"></div><div class="setup">الحساب لازم يكون مضافاً إلى <b>restaurant_staff</b>. اللوحة لا تعرض أي طلبات قبل تسجيل الدخول.</div></form></div>
<div id="app" class="page hidden"><header class="top"><div class="brand"><div class="logo">م</div><div><h1>لوحة الاستلام</h1><div class="sub">اضغط رقم الطلب فقط عندما يصل فعلياً إلى طاولة الاستلام</div></div></div><div class="actions"><div class="live"><i></i>متصل</div><button class="btn" id="refresh">تحديث</button><button class="btn" id="full">⛶</button><button class="btn" id="logout">خروج</button></div></header><div class="toolbar"><input class="search" id="search" placeholder="ابحث برقم الطلب..."><button class="btn" id="clear">مسح</button></div><main class="board"><section class="panel"><div class="head"><h2>الطلبات قيد التحضير</h2><span class="badge" id="prepCount">0</span></div><div class="grid" id="prep"></div></section><section class="panel recent"><div class="head"><h2>آخر الطلبات الجاهزة</h2><span class="badge" id="readyCount">0</span></div><div class="grid" id="ready"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const KEY='maallim-display-config-v1';const $=id=>document.getElementById(id);const cfg=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};let sb=null,session=null,rows=[];const clean=s=>String(s||'').replace(/[^\dA-Za-z_-]/g,'').slice(0,24);
function msg(t){$('error').textContent=t||''}function show(){ $('login').classList.add('hidden');$('app').classList.remove('hidden') }function hide(){ $('app').classList.add('hidden');$('login').classList.remove('hidden') }
async function setup(){const c=cfg();if(!c.url||!c.key){msg('إعداد Supabase غير موجود. افتح شاشة العرض واضبط الاتصال أولاً.');return false}sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const s=await sb.auth.getSession();session=s.data.session;if(session)return checkStaff();return false}
async function checkStaff(){const {data,error}=await sb.from('restaurant_staff').select('user_id,role,active').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(error||!data){msg('هذا الحساب غير مصرح له بلوحة الاستلام.');await sb.auth.signOut();return false}show();await load();subscribe();return true}
async function load(){if(!sb)return;const {data,error}=await sb.from('orders').select('id,order_number,status,created_at,updated_at').in('status',['pending','confirmed','preparing']).order('created_at',{ascending:true}).limit(100);if(!error){rows=data||[];render()}}
function render(){const q=clean($('search').value);const match=x=>!q||String(x.order_number||'').includes(q);const prep=rows.filter(match);$('prepCount').textContent=prep.length;$('prep').innerHTML=prep.length?prep.map(o=>`<article class="order"><div class="order-number">#${escapeHtml(o.order_number)}</div><button class="make-ready" data-id="${o.id}">جاهز للاستلام</button></article>`).join(''):'<div class="empty"><div><strong>ماكو طلبات تنتظر الاستلام</strong><span>لما يطلع الطلب من المطبخ رح يظهر هنا</span></div></div>';$('ready').innerHTML=recentReady.length?recentReady.slice(0,12).map(o=>`<div class="ready-card"><strong>#${escapeHtml(o.order_number)}</strong></div>`).join(''):'<div class="empty"><div><strong>ماكو طلبات جاهزة مؤخراً</strong></div></div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>markReady(b.dataset.id))}
let recentReady=[];async function loadRecentReady(){if(!sb)return;const {data}=await sb.from('orders').select('order_number,status,updated_at').eq('status','ready').order('updated_at',{ascending:false}).limit(12);recentReady=data||[];render()}
async function markReady(id){const btn=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(btn){btn.disabled=true;btn.textContent='يتم النقل...'}const {error}=await sb.from('orders').update({status:'ready',updated_at:new Date().toISOString()}).eq('id',id).in('status',['pending','confirmed','preparing']);if(error){if(btn){btn.disabled=false;btn.textContent='جاهز للاستلام'};return}await Promise.all([load(),loadRecentReady()]);new AudioContext&&navigator.vibrate?.(70)}
function subscribe(){sb.channel('handoff-panel').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>{load();loadRecentReady()}).subscribe();loadRecentReady()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('send').onclick=async()=>{msg('');if(!sb){if(!(await setup()))return}const phone=$('phone').value.trim();if(phone.length<10){msg('أدخل رقم هاتف صحيح.');return}const r=await sb.auth.signInWithOtp({phone,options:{shouldCreateUser:false}});if(r.error){msg(r.error.message);return}$('otpWrap').classList.remove('hidden');$('verify').classList.remove('hidden');$('send').classList.add('hidden');msg('تم إرسال رمز التحقق.');};$('verify').onclick=async()=>{msg('');const phone=$('phone').value.trim(),token=$('otp').value.trim();const r=await sb.auth.verifyOtp({phone,token,type:'sms'});if(r.error){msg(r.error.message);return}session=r.data.session;if(!session||!(await checkStaff()))msg('تعذر فتح لوحة الاستلام.')};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=()=>{load();loadRecentReady()};$('search').oninput=render;$('clear').onclick=()=>{$('search').value='';render()};$('full').onclick=()=>document.documentElement.requestFullscreen?.();setup();
</script></body></html>
