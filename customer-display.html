<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706"><title>معلم الشاورما — حالة الطلبات</title>
<style>
:root{--bg:#080706;--panel:#12100e;--gold:#f4b52e;--red:#d62918;--ember:#ed6a20;--green:#35d98b;--cream:#fff7e9;--muted:#a79d91;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(214,41,24,.2),transparent 34%),radial-gradient(circle at 0 100%,rgba(244,181,46,.1),transparent 30%),#080706}.page{min-height:100dvh;padding:clamp(18px,3vw,42px);display:grid;grid-template-rows:auto auto 1fr auto;gap:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--ember));color:#1a1008;font-weight:1000;font-size:25px;box-shadow:0 15px 45px #f4b52e26}.brand h1{margin:0;font-size:clamp(22px,3vw,38px);font-weight:1000}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.live{display:flex;align-items:center;gap:8px;color:#a8f0ca;font-size:12px}.live i{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 16px var(--green)}.hero{text-align:center;padding:10px}.hero h2{font-size:clamp(28px,5vw,64px);margin:0;font-weight:1000;letter-spacing:-2px}.hero h2 span{color:var(--gold)}.hero p{color:var(--muted);margin:8px 0 0}.boards{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}.lane{min-height:0;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#17130f,#0c0a08);overflow:hidden;box-shadow:0 25px 90px #0008}.lane-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.lane-title{display:flex;align-items:center;gap:12px;font-size:clamp(18px,2vw,28px);font-weight:950}.dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold)}.ready .dot{background:var(--green);box-shadow:0 0 20px var(--green)}.count{padding:6px 11px;border-radius:999px;background:#0005;color:#ddd;border:1px solid var(--line)}.orders{padding:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-content:start}.order{min-height:108px;border-radius:20px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#211a12,#100d0a);border:1px solid #f4b52e30;animation:in .35s ease}.ready .order{background:linear-gradient(145deg,#10251b,#0b110e);border-color:#35d98b30}.number{font-size:clamp(28px,4vw,50px);font-weight:1000;letter-spacing:-1px}.caption{font-size:10px;color:var(--muted);margin-top:3px}.empty{grid-column:1/-1;min-height:260px;display:grid;place-items:center;text-align:center;color:#706960;border:1px dashed var(--line);border-radius:20px}.empty strong{display:block;color:#a89f95;font-size:18px;margin-bottom:5px}.footer{text-align:center;color:#7d746b;font-size:11px}.footer b{color:var(--gold)}
@keyframes in{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}@media(max-width:850px){.boards{grid-template-columns:1fr}.orders{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.page{padding:12px;gap:14px}.head{align-items:flex-start}.live{display:none}.logo{width:46px;height:46px}.orders{grid-template-columns:repeat(2,1fr);padding:12px}.lane-head{padding:15px}.hero h2{font-size:30px}}
</style></head><body>
<div class="page"><header class="head"><div class="brand"><div class="logo">م</div><div><h1>معلم الشاورما</h1><p>تابع رقم طلبك هنا — لا حاجة للانتظار عند الكاونتر</p></div></div><div class="live"><i></i><span>تحديث مباشر</span></div></header><section class="hero"><h2>طلبك <span>وين صار؟</span></h2><p>لما يصير جاهز، رح يظهر رقم طلبك بقسم «جاهزة»</p></section><main class="boards"><section class="lane"><div class="lane-head"><div class="lane-title"><i class="dot"></i>قيد التحضير</div><div class="count" id="prepCount">0</div></div><div class="orders" id="prep"></div></section><section class="lane ready"><div class="lane-head"><div class="lane-title"><i class="dot"></i>جاهزة</div><div class="count" id="readyCount">0</div></div><div class="orders" id="ready"></div></section></main><footer class="footer">يرجى الاحتفاظ برقم طلبك · <b>د.ع</b></footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const KEY='maallim-display-config-v1';const $=id=>document.getElementById(id);const cfg=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};const norm=s=>String(s||'').toLowerCase();let client=null;
function render(rows){const prep=rows.filter(o=>['confirmed','preparing','in_progress','accepted'].includes(norm(o.status)));const ready=rows.filter(o=>['ready','ready_for_pickup','completed'].includes(norm(o.status)));$('prepCount').textContent=prep.length;$('readyCount').textContent=ready.length;$('prep').innerHTML=cards(prep,'جارٍ التحضير');$('ready').innerHTML=cards(ready,'جاهز للاستلام')}
function cards(rows,label){if(!rows.length)return '<div class="empty"><div><strong>لا توجد طلبات حالياً</strong><span>نحن نجهّز طلباتكم أولاً بأول</span></div></div>';return rows.map(o=>{const n=o.order_number||o.order_no||o.id?.slice(0,6)||'—';return `<article class="order"><div><div class="number">#${n}</div><div class="caption">${label}</div></div></article>`}).join('')}
async function start(){const c=cfg();if(!c.url||!c.key){render([]);return}client=window.supabase.createClient(c.url,c.key);await load();client.channel('customer-order-display').on('postgres_changes',{event:'*',schema:'public',table:'orders'},load).subscribe()}
async function load(){if(!client)return;const {data,error}=await client.from('orders').select('id,order_number,status,created_at').in('status',['confirmed','preparing','in_progress','accepted','ready','ready_for_pickup','completed']).order('created_at',{ascending:true}).limit(80);if(!error)render(data||[])}
start();setInterval(load,15000);
</script></body></html>
